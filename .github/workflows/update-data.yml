name: Update Station Data

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Update master.xlsx coordinates
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python3 - <<'EOF'
          import requests, openpyxl, os, time
          from openpyxl.styles import Font, PatternFill, Alignment
          API_KEY = os.environ['GOOGLE_MAPS_API_KEY']
          wb = openpyxl.load_workbook('scripts/master.xlsx')
          for ws in wb.worksheets:
           for row in ws.iter_rows(min_row=2):
            if not row[0].value: continue
            ku = row[0].value
            name = row[1].value
            query = name + '駅 ' + ku + ' 東京都'
            url = 'https://maps.googleapis.com/maps/api/geocode/json'
            r = requests.get(url, params={'address': query, 'key': API_KEY})
            results = r.json().get('results', [])
            if results:
             loc = results[0]['geometry']['location']
             row[3].value = round(loc['lat'], 4)
             row[4].value = round(loc['lng'], 4)
             print('OK: ' + name + ' ' + str(round(loc['lat'],4)) + ' ' + str(round(loc['lng'],4)))
            else:
             print('NG: ' + name)
            time.sleep(0.1)
          wb.save('scripts/master.xlsx')
          print('座標更新完了')
          EOF

      - name: Fetch Station Data
        run: python scripts/fetch_geojson.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/stations.json scripts/master.xlsx
          git stash
          git pull --rebase origin main
          git stash pop
          git add data/stations.json scripts/master.xlsx
          git commit -m "Update station data [skip ci]" || echo "No changes to commit"
          git push
